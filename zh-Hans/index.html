:root{
  --bg:#dde6ea; --surface:#f8fbfb; --surface-2:#edf2f4; --ink:#12252c; --muted:#506a74; --line:#c5d3d8;
  --accent:#f0a800; --accent-edge:#c98a00; --accent-ink:#2a1d00; --accent-tint:#fdf3d6;
  --brand:#c1121f; --brand-edge:#930e18; --on-brand:#ffffff; --on-role:#ffffff;
  --ok:#1f7f45; --ok-tint:#e3f3e8; --bad:#c2352a; --bad-tint:#fbe7e4;
  --scrim:rgba(18,37,44,.46); --shadow:0 12px 34px rgba(18,37,44,.18); --focus:#12252c;
  --led-scrim:rgba(13,23,28,.9); --led-ink:#ffc94a; --led-fg:#eef4f6; --led-mute:#b3c4cb; --led-line:#4c636d;
  --font-display:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Noto Sans SC","PingFang SC",sans-serif;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Noto Sans SC","PingFang SC",sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c151a; --surface:#15232a; --surface-2:#1d2f38; --ink:#e6eff2; --muted:#93a9b2; --line:#2c414b;
    --accent:#f2b01e; --accent-edge:#f7c85a; --accent-ink:#231800; --accent-tint:#33290f;
    --brand:#d42a37; --brand-edge:#f0646e; --on-brand:#ffffff; --on-role:#08131a;
    --ok:#58c483; --ok-tint:#173226; --bad:#f0796d; --bad-tint:#3a1d1b;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 34px rgba(0,0,0,.5); --focus:#e6eff2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c151a; --surface:#15232a; --surface-2:#1d2f38; --ink:#e6eff2; --muted:#93a9b2; --line:#2c414b;
  --accent:#f2b01e; --accent-edge:#f7c85a; --accent-ink:#231800; --accent-tint:#33290f;
  --brand:#d42a37; --brand-edge:#f0646e; --on-brand:#ffffff; --on-role:#08131a;
  --ok:#58c483; --ok-tint:#173226; --bad:#f0796d; --bad-tint:#3a1d1b;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 34px rgba(0,0,0,.5); --focus:#e6eff2; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}

html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:20px;font-weight:700}
p{margin:0}
.fine{font-size:12.5px;color:var(--muted);line-height:1.55}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
kbd{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:1px 6px;border:1px solid currentColor;border-radius:4px;margin-left:6px}
@media (pointer:coarse){kbd{display:none}}

.btn{min-height:44px;padding:9px 16px;border:1px solid var(--line);background:var(--surface-2);border-radius:4px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--brand);border-color:var(--brand-edge);color:var(--on-brand);font-weight:700}
.btn-primary:hover:not(:disabled){border-color:var(--ink)}
.btn-ghost{min-height:36px;padding:5px 12px;background:transparent}
.lnk{display:inline-flex;align-items:center;min-height:36px;padding:0;border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12.5px}
.bmc{display:inline-flex;align-items:center;min-height:36px;padding:5px 12px;border:1px solid var(--accent-edge);border-radius:999px;background:var(--accent-tint);color:var(--ink);font-weight:700;text-decoration:none;font-size:12.5px}
.bmc:hover{border-color:var(--ink)}

.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:nowrap;align-items:center;gap:6px 12px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:color-mix(in srgb,var(--surface) 97%,transparent);border-bottom:1px solid var(--line)}
.clockbox{display:flex;flex-direction:column;gap:1px;flex:1 1 0;min-width:0;line-height:1.1}
.clock{font-size:24px;font-weight:600;letter-spacing:.01em}
.clock-note{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.snd{display:grid;place-items:center;min-width:36px;padding:5px 8px}
.snd[aria-pressed="false"]{color:var(--muted)}

.guide{position:fixed;z-index:3;top:calc(var(--hud-h,56px) + 10px);left:12px;right:12px;margin:0 auto;width:fit-content;max-width:min(640px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:6px 6px 6px 10px;background:var(--surface);border:1px solid var(--ink);border-radius:8px;box-shadow:var(--shadow)}
.g-k{flex:none;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:3px 7px;border-radius:4px}
.g-t{min-width:0;font-size:13.5px;font-weight:500;line-height:1.4}
.guide .btn{flex:none;min-height:38px;padding:5px 12px;white-space:nowrap}
.guide.first{flex-wrap:wrap;row-gap:6px;padding-bottom:8px}
.guide.first .g-t{flex:1 1 0}
.guide.first .btn{background:var(--accent);border-color:var(--accent-edge);color:var(--accent-ink);font-weight:700;animation:nudge 1.3s ease-in-out infinite}
.g-h{flex:1 1 100%;font-size:12.5px;line-height:1.5;color:var(--muted)}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}50%{box-shadow:0 0 0 7px transparent}}

.dlg{position:fixed;z-index:6;left:12px;right:12px;margin:0 auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:720px;max-height:62%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 16px 12px;background:var(--surface);border:1px solid var(--ink);border-radius:8px;box-shadow:var(--shadow);animation:capIn .25s ease both}
.who{display:flex;align-items:center;gap:10px}
.sw{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:4px;color:var(--on-role);font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.04em}
.who b{display:block;line-height:1.2}
.who small{color:var(--muted);font-size:12.5px}
.dlg-t{position:relative;font-size:16px;line-height:1.75;min-height:3.5em;cursor:default}
.dlg-t.nar{color:var(--muted)}
.dlg-t .ghost{visibility:hidden}
.dlg-t .typed{position:absolute;inset:0}
.dlg-n{margin-right:auto}
.dlg .row.ch{flex-wrap:wrap;gap:6px}.dlg .row.ch .dlg-n{flex:1 1 100%}
.dlg .choice{flex:1 1 100%;justify-content:flex-start;text-align:left;white-space:normal;line-height:1.45;min-height:44px;padding:8px 12px;font-weight:500}
.dlg .choice:hover:not(:disabled){border-color:var(--ink)}

.term{font:inherit;color:inherit;background:none;border:0;border-bottom:2px dotted var(--accent-edge);padding:0;margin:0;cursor:pointer;line-height:1.2}
.term:hover{background:var(--accent-tint)}
.dlg-g{font-size:13.5px;line-height:1.6;padding:8px 10px;background:var(--accent-tint);border:1px solid var(--accent-edge);border-radius:4px}
.dlg-g b{font-family:var(--font-mono);font-size:12.5px}
.dlg-g.hint{background:none;border:0;color:var(--muted);font-size:12.5px;padding:0}

.toast{position:fixed;z-index:7;top:calc(var(--hud-h,56px) + 12px + var(--guide-h,0px));left:12px;right:12px;margin:0 auto;width:fit-content;max-width:min(520px,calc(100% - 24px));display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);animation:capIn .3s ease both}
.toast b{display:block;line-height:1.35}
.toast small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.toast .btn{flex:none;white-space:nowrap}
.toast.ring{top:34%;padding:16px 18px;border:1px solid var(--ink);animation:ringShake 1.1s ease-in-out infinite}
.toast.ring b{font-size:17px}
.toast.msg{align-items:flex-start;max-width:min(380px,calc(100% - 24px))}
.toast.msg b{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.toast.msg small{color:var(--ink);font-size:13.5px;line-height:1.5}
@keyframes ringShake{0%,56%,100%{transform:none}8%,24%,40%{transform:translateX(-4px) rotate(-.6deg)}16%,32%,48%{transform:translateX(4px) rotate(.6deg)}}

.tcard{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:20px;background:var(--led-scrim);cursor:pointer;animation:tcIn .3s ease both}
.tcard.out{animation:tcOut .24s ease both;pointer-events:none}
.tc{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:520px;text-align:center;color:var(--led-mute)}
.tc>*{animation:capIn .45s ease both}.tc>:nth-child(2){animation-delay:.08s}.tc>:nth-child(3){animation-delay:.16s}.tc>:nth-child(4){animation-delay:.24s}
.tc-t{font-size:clamp(60px,17vw,112px);font-weight:600;line-height:1;color:var(--led-ink);letter-spacing:.02em}
.tc h2{font-size:24px;color:var(--led-fg)}
.tc p{font-size:15px}
.tc .btn-ghost{margin-top:10px;color:var(--led-fg);border-color:var(--led-line)}
.tc .btn-ghost:focus-visible{outline-color:var(--led-fg)}
@keyframes tcIn{from{opacity:0}to{opacity:1}}
@keyframes tcOut{from{opacity:1}to{opacity:0}}
@keyframes capIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.panel{position:fixed;z-index:4;left:0;right:0;bottom:0;max-height:66%;display:flex;flex-direction:column;background:color-mix(in srgb,var(--surface) 97%,transparent);border-top:1px solid var(--line);box-shadow:var(--shadow)}
.rc{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);flex:none}

#pClose{display:inline-block;margin-left:auto;min-height:32px;padding:3px 12px;border:1px solid var(--line);background:var(--surface-2);border-radius:4px;font-size:12.5px;cursor:pointer}
.panel-body{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0;overscroll-behavior:contain}
.panel-body>*{flex:none}
.panel-body p{max-width:62ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;min-width:0}

.sys{position:fixed;inset:0;z-index:9;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.sys-win{background:var(--surface);border:1px solid var(--ink);border-radius:8px;width:100%;max-width:760px;max-height:100%;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow);overflow:hidden}
.sys-bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 14px;background:var(--ink);color:var(--surface)}
.sys-bar b{font-family:var(--font-display);font-size:15px;margin-right:auto}
.sys-logo{font-size:11px;font-weight:600;padding:2px 6px;border:1px solid var(--surface);border-radius:4px;letter-spacing:.08em}
.sys-bar .btn-ghost{color:var(--surface);border-color:var(--muted)}
.sys-body{padding:14px 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0}

.dpad{position:fixed;z-index:3;left:16px;bottom:calc(var(--panel-h,0px) + 12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:3px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button{border:1px solid var(--muted);background:var(--surface);border-radius:4px;font-size:15px;line-height:1;color:var(--ink);cursor:pointer;touch-action:none;padding:0}
.dpad button.on,.dpad button:active{background:var(--brand);border-color:var(--brand-edge);color:var(--on-brand)}
.dpad [data-k="u"]{grid-area:1/2}.dpad [data-k="l"]{grid-area:2/1}.dpad [data-k="r"]{grid-area:2/3}.dpad [data-k="d"]{grid-area:3/2}
.talk-btn{position:fixed;z-index:3;right:16px;bottom:calc(var(--panel-h,0px) + 12px + env(safe-area-inset-bottom,0px));min-height:48px;padding:8px 16px;border:1px solid var(--brand-edge);background:var(--brand);color:var(--on-brand);border-radius:4px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.ptr{position:fixed;left:0;top:0;z-index:3;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--accent);border:2px solid var(--ink);color:var(--accent-ink);font-size:17px;font-weight:900;line-height:1;pointer-events:none;box-shadow:var(--shadow);transition:transform .12s linear}
.ptr::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--accent);animation:ptrPulse 1.4s ease-out infinite}
@keyframes ptrPulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.bub{position:fixed;left:0;top:0;z-index:2;max-width:200px;padding:5px 10px;border:1px solid var(--ink);border-radius:8px;background:var(--surface);font-size:13.5px;line-height:1.35;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;background:var(--surface);border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:rotate(45deg)}
@media (max-width:859px){body:has(.panel:not([hidden])) .dpad,body:has(.panel:not([hidden])) .talk-btn{display:none}}

.home,.fin{position:fixed;inset:0;display:flex;flex-direction:row;align-items:center;justify-content:center;pointer-events:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.home{z-index:8;background:color-mix(in srgb,var(--bg) 62%,transparent)}
.fin{z-index:9;background:var(--scrim)}
.board{width:100%;max-width:540px;max-height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--ink);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.board .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 18px 16px;display:flex;flex-direction:column;gap:11px}
.board .scroll>*{flex:none}
.board .foot{flex:none;display:flex;flex-direction:column;gap:9px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.board .foot .fine{font-size:11px}
.b-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.b-title{font-size:clamp(34px,10vw,52px);font-weight:900;line-height:1.08;letter-spacing:.01em}
.b-sub{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.board fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:6px}

.tin{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);color:var(--ink);font:inherit}

.go{display:flex;align-items:center;gap:12px}

.links{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:12.5px}
.credit{display:inline-flex;flex-wrap:wrap;align-items:center;column-gap:12px;color:var(--muted)}

.langsw{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:13.5px;font-weight:700;line-height:1;background:var(--surface-2)}

.end-k{font-size:13.5px;color:var(--muted);letter-spacing:.08em}

body.at-home .hud,body.at-home .panel,body.at-home .dpad,body.at-home .talk-btn,body.at-home .guide,body.at-home .toast,body.at-home .dlg,body.at-home .ptr,body.at-home .bub{display:none}

.codex{position:fixed;inset:0;z-index:10;background:var(--scrim);display:flex;align-items:stretch;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.codex-in{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:100%;max-width:900px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}

@media (min-width:860px){
  .clockbox{flex:0 1 auto;flex-direction:row;align-items:baseline;gap:12px}
