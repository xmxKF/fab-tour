  }

機に流すこと。層どうしの重なりが揃い、誤差を抑えられる。号機を変えると再アライメントが要る。"],["振替","装置が止まったとき、待っているロットを同じ工程の別の装置へ回すこと。検証済みの装置に限る。"],["バッチ装置","炉や槽のように一度にまとめて処理する装置。満杯でなくても回せるが、待てるかどうかを計算する。"],["待ち時間制限 / Q-time","二つの工程の間でロットを置いておける上限。長く置くと酸化膜が戻り、異物も付く。超えたら洗い直す。"],["HOLD","ロットをライン上で止めて先へ流さず、技術か品質の判断を待つこと。仕掛には数えず、別に記録する。"],["着工ルール","ロットを並べる決まり。特急を優先、重要層は号機固定、待ち時間制限を見る、検証済みの装置にだけ振る。"],["再アライメント","露光装置を変えると、ウェーハ上のマークを探し直して補正を計算し直す。そのたびに重なりがずれる機会が増える。"]];termsSet(GLOSS," / ",[["i線","i 線"]],["露光前計測ステーション"]);var MOVERS=[],MAP={bounds:{x1:-40.2,x2:50.2,z1:-11.6,z2:9.1},aisle:{x1:-40.2,x2:50.2,z1:-1.5,z2:1.5},bays:[{code:"WET",name:"洗浄",x1:-40,x2:-31,z1:-11.4,z2:-3.8,stk:[-31.9,-2.6]},{code:"FURN",name:"縦型炉",x1:-31,x2:-22,z1:-11.4,z2:-3.8,stk:[-22.9,-2.6]},{code:"FILM",name:"成膜",x1:-22,x2:-12,z1:-11.4,z2:-3.8,stk:[-12.9,-2.6]},{code:"PHOTO",name:"露光",x1:-12,x2:10,z1:-11.4,z2:-3.8,stk:[9,-2.6]},{code:"ETCH",name:"エッチ",x1:10,x2:19,z1:-11.4,z2:-3.8,stk:[18.1,-2.6]},{code:"IMP",name:"インプラ",x1:19,x2:27,z1:-11.4,z2:-3.8,stk:[26.1,-2.6]},{code:"CMP",name:"CMP",x1:27,x2:34,z1:-11.4,z2:-3.8,stk:[33.1,-2.6]},{code:"MET",name:"計測",x1:34,x2:40,z1:-11.4,z2:-3.8,stk:[39.1,-2.6]},{code:"PKG",name:"先進パッケージ",x1:40,x2:50.4,z1:-11.4,z2:-3.8,stk:[49.3,-2.6]}],office:{x1:1.95,x2:28.45,z1:2,z2:9.1,name:"オフィス"},board:[12.6,2.5],entry:{x:38.8,z:4.58,name:"入口"}};levelAdd("fab",function(K){let{box,flat,lam,M,TX,label,screen,tower,pickBox,G}=K,T3=K.T,graphite=lam(4014922,{map:TX.panel}),lightGrey=lam(13225683),silverTop=lam(13225683,{map:TX.panel}),steel=lam(13226196,{map:TX.panel}),steelDark=lam(12174023,{map:TX.panel}),white=lam(15330542),midGrey=lam(9278362,{map:TX.panel}),grilleGrey=lam(10133927,{map:TX.panel}),teal=lam(2864035),amber=lam(16757575),cream=lam(12831952,{map:TX.panel}),creamFront=lam(14147554),furnaceMat=lam(7832975,{map:TX.panel}),furnaceFront=lam(9412007),filmMat=lam(11056573,{map:TX.panel}),chamberMat=lam(4280408,{map:TX.panel}),etchMat=lam(10333108,{map:TX.panel}),etchFront=lam(12174538),impMat=lam(5662321,{m
